[project]
name = "claim-check"
version = "0.1.0"
description = "Paste an article; every factual claim gets a verdict with a receipt."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "httpx>=0.27",
    "playwright>=1.64.0",
    "pypdf>=6.21.0",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
