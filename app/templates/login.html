{% extends 'base.html' %}
{% block title %}Sign in · Claim Check{% endblock %}
{% block main %}
<form class="login" method="post" action="{{ url_for('login') }}">
  <h1>Sign in</h1>
  <p>This server needs its access token.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <label>Token <input type="password" name="token" autocomplete="current-password" required autofocus></label>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
